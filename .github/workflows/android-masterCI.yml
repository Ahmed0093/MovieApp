name: Connect to VPN and Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect

      - name: Connect to VPN
        id: connect-vpn
        run: |
          echo "Connecting to VPN..."
          echo "${{ secrets.VPN_PASSWORD }}" | sudo openconnect --user=${{ secrets.VPN_USERNAME }} --passwd-on-stdin ${{ secrets.VPN_GATEWAY }} --servercert pin-sha256:T/0yX2tT3UIZmGR5de5WKUbEXSHZQBh6Dne7q0rPEm0= --background
          echo "VPN Connected"

      - name: Wait for VPN Connection
        run: sleep 10

      - name: Verify VPN Connection
        run: curl ifconfig.me

      - name: Run Tests
        run: |
          echo "Running your tasks that require VPN..."
          # Add your commands that need VPN connection here
          # For example: ./run-your-tests.sh

      - name: Disconnect from VPN
        if: always()
        run: sudo pkill openconnect
