name: Connect to VPN and Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect ca-certificates

      - name: Install CA Certificates
        run: |
          sudo apt-get install -y ca-certificates
          sudo update-ca-certificates

      - name: Connect to VPN
        id: connect-vpn
        run: |
          echo "Connecting to VPN..."
          # Perform web login and obtain session cookie
          response=$(curl -k -c cookie.txt -d "user=${{ secrets.VPN_USERNAME }}&passwd=${{ secrets.VPN_PASSWORD }}" -X POST https://213.42.155.161/global-protect/login.esp)
          # Extract session ID from cookie
          sessid=$(grep SESSID cookie.txt | awk '{print $NF}')
          # Use session ID to authenticate with openconnect
          sudo openconnect --user=${{ secrets.VPN_USERNAME }} --cookie="SESSID=$sessid" https://213.42.155.161 --servercert pin-sha256:T/0yX2tT3UIZmGR5de5WKUbEXSHZQBh6Dne7q0rPEm0= --background || (echo "Failed to connect to VPN" && exit 1)
          echo "VPN Connected"

      - name: Wait for VPN Connection
        run: sleep 10

      - name: Verify VPN Connection
        run: curl ifconfig.me

      - name: Run Tests
        run: |
          echo "Running your tasks that require VPN..."
          # Add your commands that need VPN connection here
          # For example: ./run-your-tests.sh

      - name: Disconnect from VPN
        if: always()
        run: sudo pkill openconnect
