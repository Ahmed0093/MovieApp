name: Connect to VPN and Run Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openconnect

      - name: Connect to VPN
        id: connect-vpn
        run: |
          echo "Connecting to VPN..."
          echo "123" | sudo openconnect --user=aaabdelgawad --passwd-on-stdin 123 --background
          echo "VPN Connected"

      - name: Wait for VPN Connection
        run: sleep 10

      - name: Verify VPN Connection
        run: curl ifconfig.me

      - name: Run Tests
        run: |
          echo "Running your tasks that require VPN..."
          # Add your commands that need VPN connection here
          # For example: ./run-your-tests.sh

      - name: Disconnect from VPN
        if: always()
        run: sudo pkill openconnect
